<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatteHjelpen</title>
  <!-- MathJax for LaTeX-rendering -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    textarea { width: 100%; height: 5rem; font-size: 1rem; font-family: inherit; box-sizing: border-box; }
    button { font-size: 1rem; padding: 0.5rem 1.5rem; margin-top: 0.5rem; cursor: pointer; }
    button:disabled { cursor: wait; opacity: 0.6; }
    .validert-ok { color: #0a7a2a; font-weight: bold; }
    .validert-feil { color: #b3261e; font-weight: bold; }
    .valideringsdetaljer { color: #555; font-size: 0.9rem; margin-top: 0.25rem; }
    .kostnad { color: #666; font-size: 0.9rem; margin-top: 1rem; }
    .feilmelding { color: #b3261e; margin-top: 1rem; }
    .status { color: #666; margin-top: 0.5rem; }
    li { margin-bottom: 0.5rem; }
    #formler li { font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>MatteHjelpen 🧮</h1>
  <p>Skriv inn en matteoppgave (f.eks. «Løs y'' + 4y = 0» eller «Deriver x²·sin(x)»):</p>
  <textarea id="oppgave" placeholder="Skriv oppgaven her..."></textarea>
  <br>
  <button id="losBtn" onclick="los()">Løs</button>
  <span id="status" class="status"></span>

  <div id="feil" class="feilmelding" style="display:none"></div>

  <div id="resultat" style="display:none">
    <h2>Svar</h2>
    <div id="svar"></div>
    <h3>Stegvis løsning</h3>
    <ol id="steg"></ol>
    <h3>Formler brukt</h3>
    <ul id="formler"></ul>
    <p id="validering"></p>
    <p class="valideringsdetaljer" id="valideringsdetaljer"></p>
    <p class="kostnad" id="kostnad"></p>
  </div>

  <script>
    async function los() {
      const knapp = document.getElementById('losBtn');
      const status = document.getElementById('status');
      const feilDiv = document.getElementById('feil');
      const oppgave = document.getElementById('oppgave').value;

      feilDiv.style.display = 'none';
      if (!oppgave.trim()) {
        feilDiv.textContent = 'Skriv inn en oppgave først.';
        feilDiv.style.display = 'block';
        return;
      }

      knapp.disabled = true;
      status.textContent = 'Løser (kan ta noen sekunder)...';

      let data;
      try {
        const res = await fetch('/solve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ oppgave })
        });
        data = await res.json();
      } catch (e) {
        knapp.disabled = false;
        status.textContent = '';
        feilDiv.textContent = 'Klarte ikke å nå serveren: ' + e;
        feilDiv.style.display = 'block';
        return;
      }

      knapp.disabled = false;
      status.textContent = '';

      document.getElementById('resultat').style.display = 'block';
      document.getElementById('svar').innerHTML = data.svar;
      document.getElementById('steg').innerHTML =
        (data.steg || []).map(s => `<li>${s}</li>`).join('') ||
        '<li><em>Ingen steg oppgitt.</em></li>';

      const formler = data.formler_brukt || [];
      document.getElementById('formler').innerHTML = formler.length
        ? formler.map(f => {
            if (typeof f === 'string') return `<li>${f}</li>`;
            const stegtekst = f.steg ? ` (steg ${f.steg})` : '';
            return `<li><strong>${f.id}</strong> – ${f.navn}${stegtekst} · <em>${f.referanse}</em></li>`;
          }).join('')
        : '<li><em>Ingen formler oppgitt for denne oppgaven.</em></li>';

      const v = document.getElementById('validering');
      v.textContent = data.validert ? '✅ Svaret er numerisk validert' : '❌ Svaret kunne IKKE valideres – stol ikke blindt på det!';
      v.className = data.validert ? 'validert-ok' : 'validert-feil';
      document.getElementById('valideringsdetaljer').textContent = data.valideringsdetaljer || '';

      document.getElementById('kostnad').textContent =
        `Tokens brukt: ${data.tokens_brukt} · Estimert kostnad: $${data.estimert_kostnad}`;

      MathJax.typeset();
    }

    document.getElementById('oppgave').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) los();
    });
  </script>
</body>
</html>
